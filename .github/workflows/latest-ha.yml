# Weekly check against the newest Home Assistant release, so breaking HA changes
# show up before users report them. The pinned baseline stays in tests.yml.
# Cost: standard GitHub-hosted runner only (free for public repositories).
name: Latest Home Assistant

on:
  schedule:
    - cron: "41 10 * * 2" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install newest HA test framework
        run: python -m pip install --upgrade pytest-homeassistant-custom-component PyTurboJPEG -e .
      - name: Install the frontend version that HA release expects
        run: |
          frontend=$(python - <<'PY'
          import pathlib, homeassistant
          path = pathlib.Path(homeassistant.__file__).parent / "package_constraints.txt"
          print(next(l for l in path.read_text().splitlines() if l.startswith("home-assistant-frontend==")))
          PY
          )
          python -m pip install "$frontend"
      - name: Show tested version
        run: python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - run: python -m pytest tests/ha
