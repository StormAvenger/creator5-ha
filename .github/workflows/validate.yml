# HACS and hassfest validation (both required for the HACS default store).
# Cost: standard GitHub-hosted runners are free for public repositories.
# No larger runners, artifacts or caches are used. See docs/cost-policy.md.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # weekly, to catch new HACS/HA requirements
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-11-06
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-11-06
