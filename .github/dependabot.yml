# Free for public repositories. Opens grouped weekly PRs; CI checks each one.
version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (updates the
  # version comment beside each pin too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The pinned HA test baseline (requirements-ha-test.txt) and dev tools.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3
