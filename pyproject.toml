[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "creator5py"
version = "0.3.4"
description = "FlashForge Creator 5 LAN status and chamber-light client"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.15,<2", "build>=1,<2"]

[project.scripts]
creator5-probe = "creator5py.cli:main"

[tool.setuptools]
packages = ["creator5py"]
package-dir = {creator5py = "custom_components/creator5/creator5py"}

[tool.setuptools.package-data]
creator5py = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["creator5py"]
mypy_path = "custom_components/creator5"
